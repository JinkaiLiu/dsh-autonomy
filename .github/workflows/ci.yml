name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node-version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
          - os: ubuntu-latest
            node-version: 24
          - os: ubuntu-latest
            node-version: 26
          - os: windows-latest
            node-version: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  compatibility:
    name: DSH ${{ matrix.dsh-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh-version: [0.1.0-rc.6, 0.1.0-rc.7, 0.1.1-rc.2, 0.1.2-rc.1, 0.1.7-alpha.2, 0.1.7-rc.2, 0.2.1-alpha.1]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install exact DSH API family
        env:
          DSH_VERSION: ${{ matrix.dsh-version }}
        run: node scripts/install-dsh.mjs "$DSH_VERSION"
      - run: pnpm run check

  upstream-prerelease:
    name: DSH ${{ matrix.dsh-channel }} compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: 0
    strategy:
      fail-fast: false
      matrix:
        dsh-channel: [latest, next, alpha]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Resolve and install current DSH API family
        env:
          DSH_CHANNEL: ${{ matrix.dsh-channel }}
        run: node scripts/install-dsh.mjs "$DSH_CHANNEL"
      - run: pnpm run check
      - name: Install, boot, and uninstall isolated Web profile
        run: bash scripts/smoke-web.sh

  package:
    name: Package and profile smoke
    runs-on: ubuntu-latest
    env:
      DSH_VERSION: 0.2.0-rc.2
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run pack:check
      - run: pnpm dlx publint@0.3.23
      - name: Install, boot, and uninstall isolated Web profile
        run: bash scripts/smoke-web.sh
